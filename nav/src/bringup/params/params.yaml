map_server:
  ros__parameters:
    use_sim_time: true


dynamic_map:
  ros__parameters:
    use_sim_time: true
    enabled: true
    cloud_topic: /cloud_registered
    static_pcd: "package://bringup/map/rmuc_2027.pcd"
    static_pcd_frame: map          # PCD 本身的坐标系，必须与实际地图一致
    tracking_frame: odom           # 累积和记忆使用固定、重力对齐的坐标系
    robot_base_frame: base_link_fake
    resolution: 0.05
    update_frequency: 10.0
    input_timeout: 0.5             # ROS 时间及接收墙钟任一超时，动态层失效
    tf_wait_timeout: 0.15
    processing_timeout: 0.25
    max_cloud_points: 200000
    max_accumulated_points: 500000
    accumulate_frames: 4
    accumulate_duration: 0.35
    roi:
      min_radius: 0.4
      max_radius: 8.0
      min_z: -0.45                 # 相对机器人原点，沿 tracking_frame 的竖直轴
      max_z: 0.8
    voxel_size: 0.03
    static_voxel_size: 0.05
    static_distance_threshold: 0.2
    sor:
      neighbors: 12
      stddev_multiplier: 2.0
    min_density_per_m2: 400.0      # 0.05 m 栅格允许单个 Voxel 点；独立多帧由置信度确认
    component_connection_distance: 0.55  # m，仅连接稀疏观测做分组，不填充障碍几何
    min_component_area: 0.0075     # m²，8 邻域连通域
    memory:
      hit_rate: 5.0
      decay_rate: 0.7
      on_threshold: 0.6
      off_threshold: 0.25
      obstacle_timeout: 1.0
      maximum_evidence_dt: 0.2
    debug_clouds: false


global_costmap:
  ros__parameters:
    dynamic_obstacles:
      enabled: true
      topic: /dynamic_map/obstacles_raw
      message_timeout: 0.5
      observation_timeout: 0.6
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link_fake
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
    map_topic: /map
    rolling_window: false
    footprint_clearing_enabled: true
    lethal_cost_threshold: 100
    trinary_costmap: true
    inflate_unknown: false
    inflate_around_unknown: false
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 0.5
    costmap_topic: /global_costmap/costmap_raw
    costmap_timeout: 1.0


local_costmap:
  ros__parameters:
    dynamic_obstacles:
      enabled: true
      topic: /dynamic_map/obstacles_raw
      message_timeout: 0.5
      observation_timeout: 0.6
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link_fake
    robot_radius: 0.15
    footprint: ''
    footprint_padding: 0.01
    track_unknown_space: true
    inflation_radius: 0.55
    cost_scaling_factor: 5.0
    map_topic: /map
    rolling_window: true
    footprint_clearing_enabled: true
    lethal_cost_threshold: 100
    trinary_costmap: true
    inflate_unknown: false
    inflate_around_unknown: false
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 0.5
    costmap_topic: /local_costmap/costmap_raw
    costmap_timeout: 1.0
    width: 9.0
    height: 9.0
    resolution: 0.05


nav_executor:
  ros__parameters:
    use_sim_time: true
    log_enbaled: false  # 是否输出终端 Task state 日志
    tick_frequency: 20.0
    goal_tolerance: 0.05
    retry_delay: 1.0
    planning_timeout: 5.0
    controller_frequency: 20.0
    task:
      max_plan_attempts: 5
      timeout: 120.0
      rviz_priority: 10
    safety:
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_displacement: 0.08
      maximum_measured_speed: 0.05
      maximum_sample_gap: 0.3
      braking_acceleration: 2.0
    recovery:
      distance: 0.35
      search_radius: 1.0
      speed: 0.15
      timeout: 6.0
      acceleration: 0.3
      margin: 0.03
      hazard_threshold: 20
    spin:
      prepare_timeout: 3.0
      angular_speed: 0.5
      angular_acceleration: 0.5
      stop_speed: 0.05
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    odom_timeout: 0.5
    tf_timeout: 0.5
    route_monitor:
      enabled: true
      deviation_distance: 0.5
      deviation_duration: 1.0
      stall_duration: 3.0
      minimum_command_speed: 0.1
      minimum_progress: 0.1
      maximum_sample_gap: 0.25
      replan_cooldown: 2.0
      path_blocked:
        enabled: true
        lookahead_distance: 5.0
        safety_margin: 0.05
        confirmations: 3
        maximum_sample_gap: 1.0



topology_planner:
  ros__parameters:
    use_sim_time: true
    TopoPlanner:
      topology_yaml: "topo.yaml"  
      use_topology: false
      fallback_to_inner_planner: false
      allow_nearest_region_fallback: false
      enforce_region_constraint: true
      region_boundary_tolerance: 0.03
      region_constraint_tolerance: 0.15
      transform_tolerance: 0.1
      duplicate_pose_tolerance: 0.02
      blocked_goal_reset_distance: 0.50
      blocked_connector_cost: 999.0
      grid:
        tolerance: 0.0  # Require the requested endpoint; do not silently substitute a nearby goal
        cost_field_radius: 0.6
        cost_weight: 1.0
        smooth: true
        smoothing_backend: "osqp_corridor"
        smoothing_dt: 0.1
        smoothing_max_speed: 3.0
        smoothing_max_acc: 1.0
        smoothing_time_limit: 10.0
        smoothing_iterations: 6
        smoothing_corridor_range: 2.5
        allow_unknown: true
        use_final_approach_orientation: true
